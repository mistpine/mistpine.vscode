name: Release

# Push a tag v<version> equal to the version in package.json, e.g. v1.0.1.
#
# Publishes with trusted publishing (OIDC), so no tokens are stored: the
# VS Code Marketplace and Open VSX each trust this workflow, in the
# `release` environment, through a policy on the publisher (Marketplace:
# publisher page → Trusted Publishing; Open VSX: Settings → Trusted
# Publishers). See the README's Releasing section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token both registries exchange
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Tag matches package.json
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          echo "VSIX=mistpine-$version.vsix" >> "$GITHUB_ENV"
      - run: pnpm exec vsce package --no-dependencies -o "$VSIX"
      - name: Publish to the VS Code Marketplace
        run: pnpm exec vsce publish --oidc --packagePath "$VSIX" --skip-duplicate
      - name: Publish to Open VSX (Cursor, VSCodium, Windsurf)
        run: pnpm exec ovsx publish "$VSIX" --trusted-publishing --skip-duplicate
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes "$VSIX"
